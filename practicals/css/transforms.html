<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 2D and 3D Transform Practical</title><style>body{font:16px Arial;background:#f4f5ef;padding:32px}.grid{display:flex;gap:28px;flex-wrap:wrap}.tile{width:150px;height:120px;display:grid;place-items:center;background:#17634f;color:white;border-radius:14px;transition:transform .4s}.translate:hover{transform:translate(12px,-8px)}.rotate:hover{transform:rotate(12deg)}.scale:hover{transform:scale(1.12)}.skew:hover{transform:skew(-8deg)}.scene{perspective:600px}.three-d:hover{transform:rotateY(28deg) rotateX(16deg) translateZ(24px)}.tile{cursor:pointer}</style></head><body><h1>CSS 2D and 3D Transformations</h1><p>Hover over each tile to see the transformation.</p><div class="grid"><div class="tile translate">translate()</div><div class="tile rotate">rotate()</div><div class="tile scale">scale()</div><div class="tile skew">skew()</div><div class="scene"><div class="tile three-d">3D rotate</div></div></div></body></html>
